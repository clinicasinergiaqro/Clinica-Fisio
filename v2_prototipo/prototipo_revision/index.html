<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SINERGIA · Revisión y aprobación de diagnósticos y objetivos</title>
<style>
  :root{--navy:#1B3A6B;--gold:#C8A24B;--ink:#13203a;--mut:#6a7690;--line:#d8deea;--bg:#f4f6fa;--ok:#1F8A4C;--warn:#8a5e0c;--bad:#b00020;}
  *{box-sizing:border-box}
  body{font:14px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);margin:0}
  header{background:var(--navy);color:#fff;padding:12px 18px;position:sticky;top:0;z-index:6}
  header h1{font-size:16px;margin:0 0 2px}
  header .sub{font-size:11px;opacity:.85}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:48px;z-index:5}
  .bar .sp{flex:1}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 10px}
  button.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
  button.gold{background:var(--gold);color:#3a2d06;border-color:var(--gold)}
  button.sm{padding:3px 8px;font-size:12px}
  select,input[type=text]{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:7px}
  .wrap{max-width:1060px;margin:0 auto;padding:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 16px}
  .card.vacio{border-left:5px solid var(--gold)} .card.bloq{border-left:5px solid var(--bad)} .card.done{border-left:5px solid var(--ok)}
  .chead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:2px solid var(--navy);padding-bottom:6px;margin-bottom:8px}
  .chead h2{font-size:17px;color:var(--navy);margin:0 0 3px}
  .chip{display:inline-block;background:#eef2f8;border-radius:10px;padding:1px 8px;font-size:11px;margin-right:4px}
  .chip.gold{background:#f6efdd;color:#7a5c14}.chip.oct{background:#e7f0ff;color:var(--navy)}
  .state{font-size:11px;border-radius:7px;padding:4px 8px;text-align:center;max-width:150px}
  .state.rev{background:#fff7e6;border:1px solid #e3c878}.state.bloq{background:#fdeaea;border:1px solid #d99;color:var(--bad)}.state.done{background:#e8f6ee;border:1px solid #8ccfa6;color:var(--ok)}
  .verif{background:#f7f9fc;border:1px dashed var(--line);border-radius:8px;padding:7px 10px;font-size:12px;margin:6px 0}.verif.nm{background:#fff7e6;border-color:#e3c878}
  .sec{border:1px solid var(--line);border-radius:9px;margin:8px 0;padding:8px 10px}
  .sec.pend{background:#fffdf7;border-color:#e8d79a}
  .sec.ok{background:#f6fbf8;border-color:#bfe3cd}
  .sec.warn{background:#fff7ef;border-color:#e6c08a}
  .sello{font-size:11px;border-radius:6px;padding:4px 8px;margin-top:5px}
  .sello.ok{background:#e8f6ee;border:1px solid #8ccfa6;color:var(--ok)}
  .sello.pend{background:#fff3df;border:1px solid #e3c878;color:#7a5c14}
  .sello.bad{background:#fdeaea;border:1px solid #d99;color:var(--bad);font-weight:600}
  .sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .sec-h b{color:var(--navy);font-size:13px}
  .badge{font-size:10px;border-radius:6px;padding:1px 7px}
  .badge.pend{background:#f3e7c0;color:#7a5c14}.badge.cons{background:#e7edf6;color:var(--navy)}.badge.acep{background:#d9f0e2;color:var(--ok)}.badge.edit{background:#e2e9fb;color:var(--navy)}.badge.rech{background:#f6dede;color:var(--bad)}
  .two{display:flex;gap:10px;margin-top:5px}.two>div{flex:1;min-width:0}
  .lbl{font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);font-weight:700;margin-bottom:2px}
  .box{border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#fbfcfe;font-size:12.5px;white-space:pre-wrap}
  .box.ant.vacio{color:var(--bad);background:#fff6f6;border-color:#ecc;font-style:italic}
  .box.prop{border-color:var(--navy);background:#f7faff}
  .box.final{border-color:var(--ok);background:#f4fbf6}
  .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .opts label{display:inline-flex;align-items:center;gap:4px;font-size:12px;border:1px solid var(--line);border-radius:7px;padding:3px 8px;cursor:pointer;background:#fff}
  .opts label.on{border-color:var(--navy);background:#eef3fb;font-weight:600}
  textarea{width:100%;min-height:70px;font:inherit;border:1px solid var(--line);border-radius:8px;padding:7px;margin-top:5px}
  .mut{color:var(--mut)}
  ul.chk,ul.prec{margin:3px 0;padding-left:18px;font-size:12px}ul.prec.danger li b{color:var(--bad)}ul.prec.warn li b{color:var(--warn)}
  .cfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
  .drybox{background:#0d1c33;color:#d7e3f5;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;border-radius:8px;padding:10px;margin-top:8px;white-space:pre-wrap;display:none}
  .banner{background:#fff;border:1px solid var(--line);border-left:5px solid var(--navy);border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:12.5px}
  .count{font-size:12px;color:var(--mut)}
  dialog{border:none;border-radius:12px;max-width:820px;width:94%;padding:0}dialog .dh{background:var(--navy);color:#fff;padding:10px 16px;font-weight:600}dialog .db{padding:14px 16px;max-height:72vh;overflow:auto}
</style>
</head>
<body>
<header>
  <h1>SINERGIA · Revisión y aprobación individual de diagnósticos y objetivos</h1>
  <div class="sub">PROTOTIPO · datos de prueba · <b>no modifica expedientes reales</b> · revisión POR SECCIÓN · nada se acepta automáticamente</div>
</header>
<div class="bar">
  <label>Revisor: <input type="text" id="revisor" placeholder="tu nombre" size="16"></label>
  <label>Filtro: <select id="filtro">
    <option value="todos">Todos</option>
    <option value="vacios" selected>Con campos vacíos (prioridad)</option>
    <option value="pendientes">Con secciones sin revisar</option>
    <option value="bloq">Con seguridad a resolver</option>
    <option value="aprobados">Aprobados</option>
  </select></label>
  <span class="count" id="count"></span>
  <span class="sp"></span>
  <button class="sm" id="btnFlujo">Flujo de aplicación</button>
  <button class="sm" id="btnReset">Reiniciar decisiones</button>
  <button class="primary sm" id="btnExport">Exportar decisiones (JSON)</button>
  <button class="gold sm" id="btnDryAll">Simular guardado de aprobados (en seco)</button>
</div>
<div class="wrap"><div class="banner" id="banner"></div><div id="lista"></div></div>
<dialog id="modal"><div class="dh" id="modalTitle">—</div><div class="db" id="modalBody"></div><div style="padding:10px 16px;text-align:right"><button onclick="document.getElementById('modal').close()">Cerrar</button></div></dialog>

<script src="datos_revision.js"></script>
<script>
(function(){
  "use strict";
  var D = (window.DATOS_REVISION && window.DATOS_REVISION.items) || [];
  var META = (window.DATOS_REVISION && window.DATOS_REVISION._meta) || {};
  var LS = "sinergia_revision_v2";
  var SEC = [
    {k:"dx_medico", label:"Diagnóstico médico", campo:"dxMedico", obj:false},
    {k:"dx_funcional", label:"Diagnóstico funcional", campo:"dxFuncional.dxFuncional", obj:false},
    {k:"cp", label:"Objetivos — corto plazo", campo:"dxFuncional.objetivosCP", obj:true},
    {k:"mp", label:"Objetivos — mediano plazo", campo:"dxFuncional.objetivosMP (nuevo, aditivo)", obj:true},
    {k:"lp", label:"Objetivos — largo plazo", campo:"dxFuncional.objetivosLP", obj:true}
  ];
  function load(){ try{return JSON.parse(localStorage.getItem(LS)||"{}");}catch(e){return {};} }
  function save(){ try{localStorage.setItem(LS,JSON.stringify(ST));}catch(e){} render(); }
  var ST = load();
  // Hash determinista (FNV-1a 32-bit) para integridad del texto aprobado en el navegador.
  function _h(str){ str=String(str==null?"":str); var h=0x811c9dc5; for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=(h+((h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24)))>>>0; } return ("0000000"+h.toString(16)).slice(-8); }
  function revisorActual(){ var el=document.getElementById("revisor"); return (el&&el.value||"").trim(); }
  function st(it){
    var k=it.codigo; var ph=it.verificacion.proposal_hash||null;
    if(!ST[k] || ST[k].source_hash!==it.verificacion.source_hash || ST[k].proposal_hash!==ph){
      ST[k]={ source_hash:it.verificacion.source_hash, proposal_hash:ph, verificado:false, revisor:null, ts:null, sec:{} };
      SEC.forEach(function(s){ ST[k].sec[s.k]={modo:"pendiente", texto:null, ts:null, approved_hash:null, revisor:null}; });
    }
    return ST[k];
  }
  function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,function(m){return ({"&":"&amp;","<":"&lt;",">":"&gt;"})[m];}); }
  function byc(c){ return D.filter(function(x){return x.codigo===c;})[0]; }
  function propTexto(sec, s){ return s.obj ? (sec.propuesto||[]).map(function(t){return "• "+t;}).join("\n") : (sec.propuesto||""); }
  function finalTexto(it,s,d){
    var sec=it.secciones[s.k];
    if(d.modo==="aceptar") return propTexto(sec,s);
    if(d.modo==="editar") return d.texto!=null?d.texto:propTexto(sec,s);
    if(d.modo==="conservar"||d.modo==="rechazar") return sec.anterior||"";
    return null; // pendiente
  }
  // Hash del texto final de un apartado (modo + texto). Lo que se sella al aprobar.
  function finalHash(it,s,d){ var t=finalTexto(it,s,d); return t==null?null:_h(d.modo+"|"+t); }
  // Un apartado queda APROBADO sólo si: decidido, sellado por un revisor, y el texto final NO cambió desde el sello.
  function secAprobada(it,s){ var d=st(it).sec[s.k]; if(d.modo==="pendiente") return false; if(!d.approved_hash||!d.revisor) return false; return d.approved_hash===finalHash(it,s,d); }
  function secInvalidada(it,s){ var d=st(it).sec[s.k]; return d.modo!=="pendiente" && d.approved_hash && d.revisor && d.approved_hash!==finalHash(it,s,d); }
  // Sella la aprobación del apartado (exige revisor). Devuelve false si falta revisor.
  function sellar(it,s){ var r=revisorActual(); if(!r){ alert("Escribe tu nombre en 'Revisor' antes de aprobar un apartado."); return false; } var d=st(it).sec[s.k]; d.approved_hash=finalHash(it,s,d); d.revisor=r; d.ts=new Date().toISOString(); return true; }

  function seccionHTML(it, s){
    var sec=it.secciones[s.k]; var d=st(it).sec[s.k];
    var ant = sec.anterior||"";
    var prop = propTexto(sec,s);
    var badgeMap={pendiente:["pend","PENDIENTE"],conservar:["cons","Conservar"],aceptar:["acep","Aceptar"],editar:["edit","Editar"],rechazar:["rech","Rechazar"]};
    var bm=badgeMap[d.modo]||badgeMap.pendiente;
    var docExtra="";
    if(s.k==="dx_medico"){
      if(sec.documentado && sec.documentado.length) docExtra+='<div class="mut" style="font-size:11px;margin-top:3px">Recuperado de documento: '+sec.documentado.map(function(p){return esc(p.dx)+" <i>("+esc(p.fuente||"doc")+(p.fecha?", "+esc(p.fecha):"")+")</i>";}).join(" · ")+'</div>';
      if(sec.radiologicos && sec.radiologicos.length) docExtra+='<div class="mut" style="font-size:11px">Hallazgo radiológico (no es dx confirmado): '+sec.radiologicos.map(function(r){return esc((r.estudio?r.estudio+": ":"")+(r.impresion||""))+(r.fecha?" ("+esc(r.fecha)+")":"");}).join(" · ")+'</div>';
    }
    function opt(v,txt){ return '<label class="'+(d.modo===v?"on":"")+'"><input type="radio" name="'+it.codigo+'_'+s.k+'" '+(d.modo===v?"checked":"")+' onclick="RV.set(\''+it.codigo+'\',\''+s.k+'\',\''+v+'\')">'+txt+'</label>'; }
    var editor = d.modo==="editar" ? '<textarea oninput="RV.txt(\''+it.codigo+'\',\''+s.k+'\',this.value)">'+esc(d.texto!=null?d.texto:prop)+'</textarea>'+
      '<div style="margin-top:4px"><button class="sm" onclick="RV.ins(\''+it.codigo+'\',\''+s.k+'\',\'ant\')">+ Insertar anterior</button> <button class="sm" onclick="RV.ins(\''+it.codigo+'\',\''+s.k+'\',\'prop\')">+ Insertar propuesta</button></div>' : '';
    var fin = finalTexto(it,s,d);
    var aprob=secAprobada(it,s), inval=secInvalidada(it,s);
    var sello="";
    if(d.modo!=="pendiente"){
      if(aprob) sello='<div class="sello ok">✓ Aprobado por <b>'+esc(d.revisor)+'</b> · '+esc((d.ts||"").slice(0,16).replace("T"," "))+' · approved_hash <span class="mut">'+esc(d.approved_hash)+'</span></div>';
      else if(inval) sello='<div class="sello bad">⚠ APROBACIÓN INVALIDADA: el texto cambió después de aprobar. Vuelve a confirmar. <button class="sm" onclick="RV.confirmar(\''+it.codigo+'\',\''+s.k+'\')">✓ Re-confirmar apartado</button></div>';
      else sello='<div class="sello pend">Falta confirmar este apartado con tu nombre. <button class="sm" onclick="RV.confirmar(\''+it.codigo+'\',\''+s.k+'\')">✓ Confirmar apartado</button></div>';
    }
    var finBox = (d.modo!=="pendiente") ? '<div style="margin-top:5px"><div class="lbl">Texto final a guardar '+(d.modo==="conservar"||d.modo==="rechazar"?'(sin cambio — se conserva lo anterior)':'')+'</div><div class="box final">'+(fin?esc(fin):"<span class=\"mut\">(vacío)</span>")+'</div>'+sello+'</div>' : '';
    var secCls=d.modo==="pendiente"?"pend":(aprob?"ok":"warn");
    return '<div class="sec '+secCls+'">'+
      '<div class="sec-h"><b>'+esc(s.label)+'</b> <span class="mut" style="font-size:10px">→ '+esc(s.campo)+'</span><span class="badge '+bm[0]+'">'+bm[1]+(aprob?" ✓":(d.modo!=="pendiente"?" ⏳":""))+'</span></div>'+
      '<div class="two"><div><div class="lbl">Texto anterior (expediente)</div><div class="box ant '+(ant?"":"vacio")+'">'+(ant?esc(ant):"— vacío / no documentado —")+'</div>'+docExtra+'</div>'+
      '<div><div class="lbl">Propuesta (V2.2.3)</div><div class="box prop">'+(prop?esc(prop):"<span class=\"mut\">— sin propuesta —</span>")+'</div></div></div>'+
      '<div class="opts">'+opt("conservar",(ant?"Conservar anterior":"Conservar vacío"))+opt("aceptar","✓ Aceptar propuesta")+opt("editar","✎ Editar/combinar")+opt("rechazar","✕ Rechazar")+'</div>'+editor+finBox+'</div>';
  }

  // APROBADO sólo si: no bloqueado, verificado, revisor, y CADA apartado sellado y sin cambios posteriores.
  function aprobado(it){ var S=st(it); if(it.bloquea_plan) return false; if(!S.verificado) return false; if(!S.revisor) return false; return SEC.every(function(s){return secAprobada(it,s);}); }
  function pendientesN(it){ return SEC.filter(function(s){return !secAprobada(it,s);}).length; }
  function invalidadasN(it){ return SEC.filter(function(s){return secInvalidada(it,s);}).length; }

  function card(it){
    var S=st(it); var v=it.verificacion; var ap=aprobado(it);
    var cls=it.bloquea_plan?"bloq":(ap?"done":(it.nVacios>0?"vacio":""));
    var chips='<span class="chip">'+esc(it.patologia||"—")+'</span>'+'<span class="chip oct">corte '+esc(v.fecha_corte||"—")+'</span>'+(it.nVacios>0?'<span class="chip gold">'+it.nVacios+' campos vacíos</span>':'');
    var stateCls=it.bloquea_plan?"bloq":(ap?"done":"rev");
    var nInv=invalidadasN(it);
    var stateTxt=it.bloquea_plan?"Resolver seguridad":(ap?"APROBADO":(nInv?nInv+" invalidada(s) · ":"")+pendientesN(it)+" sección(es) por revisar");
    var verifCls=v.posible_nuevo_motivo?"verif nm":"verif";
    var verif='<div class="'+verifCls+'"><b>Verificación antes de aplicar</b> · episodio activo (motivoActualIndex): <b>'+esc(v.episodio_activo)+'</b>'+(v.num_episodio!=null?' · nº episodio '+esc(v.num_episodio):'')+' · corte <b>'+esc(v.fecha_corte||"—")+'</b> · '+esc(v.soap_n)+' nota(s) SOAP'+(v.valoracion_inicial_fecha?' · valoración inicial '+esc(v.valoracion_inicial_fecha):'')+' · <span class="mut">source_hash '+esc(v.source_hash)+' · proposal_hash '+esc(v.proposal_hash||"—")+'</span>'+(v.posible_nuevo_motivo?'<br>⚠ POSIBLE NUEVO MOTIVO: lo decide el fisioterapeuta; la IA no inicia motivo.':'')+'<br><label style="font-size:12px"><input type="checkbox" '+(S.verificado?"checked":"")+' onclick="RV.verif(\''+it.codigo+'\',this.checked)"> Verifiqué paciente, episodio activo, fecha de corte y que no hay cambios/notas posteriores</label><div class="mut" style="font-size:10.5px">Si el expediente o la propuesta cambian, o si editas el texto tras aprobar, la aprobación de ese apartado se invalida y debe re-confirmarse.</div></div>';
    var secs=SEC.map(function(s){return seccionHTML(it,s);}).join("");
    var pend=(it.pendientes||[]);
    var restr=(it.restricciones_recuperadas||[]);
    var enl=(it.enlaces_no_consultados||[]);
    var extra='<div class="two" style="margin-top:8px"><div><div class="lbl">Hallazgos pendientes</div>'+(pend.length?'<ul class="chk">'+pend.slice(0,5).map(function(p){return "<li>"+esc(p)+"</li>";}).join("")+'</ul>':'<div class="mut">—</div>')+
      (enl.length?'<div class="mut" style="font-size:11px">Documentos NO consultados (enlace de portal): '+enl.length+'</div>':'')+'</div>'+
      '<div><div class="lbl">Precauciones clínicas</div>'+precHTML(it)+(restr.length?'<div class="mut" style="font-size:11px">Restricciones recuperadas de documentos: '+esc(restr.join("; "))+'</div>':'')+'</div></div>';
    return '<div class="card '+cls+'" id="card_'+it.codigo+'"><div class="chead"><div><h2>'+esc(it.codigo)+'</h2>'+chips+'</div><div class="state '+stateCls+'">'+stateTxt+'</div></div>'+
      verif+secs+extra+
      '<div class="cfoot"><button class="sm" onclick="RV.dry(\''+it.codigo+'\')">Preparar aplicación (en seco)</button><span class="mut" style="font-size:11.5px">No escribe nada; muestra el payload, el texto final y las verificaciones.</span></div><div class="drybox" id="dry_'+it.codigo+'"></div></div>';
  }
  function precHTML(it){ var al=it.precauciones||[]; if(!al.length) return '<div class="mut">Sin alertas con los datos disponibles.</div>'; var danger=it.bloquea_plan; return '<ul class="prec '+(danger?"danger":"warn")+'">'+al.map(function(a){return "<li><b>"+esc(a.regla)+"</b> · "+esc(a.clase)+(a.requiere_validacion?' <span class="mut">(requiere validación)</span>':"")+"<br>"+esc(a.accion)+"</li>";}).join("")+'</ul>'+(it.bloquea_plan?'<div style="color:var(--bad);font-weight:700;font-size:12px">Plan BLOQUEADO hasta resolver.</div>':""); }

  function payload(it){
    var S=st(it); var campos={}, cambios=[], sellos={};
    SEC.forEach(function(s){
      var d=S.sec[s.k]; var ap=secAprobada(it,s);
      // Sólo se escribe lo APROBADO (sellado por revisor y sin cambios posteriores).
      if((d.modo==="aceptar"||d.modo==="editar") && ap){ campos[s.campo.split(" ")[0]] = finalTexto(it,s,d); cambios.push(s.label+": "+(d.modo==="editar"?"editado por "+d.revisor:"aceptar propuesta ("+d.revisor+")")); sellos[s.k]={revisor:d.revisor,ts:d.ts,approved_hash:d.approved_hash}; }
      else if(d.modo==="rechazar" && ap){ cambios.push(s.label+": propuesta RECHAZADA (conserva lo existente) ("+d.revisor+")"); sellos[s.k]={revisor:d.revisor,ts:d.ts,approved_hash:d.approved_hash}; }
      else if(d.modo==="conservar" && ap){ cambios.push(s.label+": conservar lo existente, sin cambio ("+d.revisor+")"); sellos[s.k]={revisor:d.revisor,ts:d.ts,approved_hash:d.approved_hash}; }
      else if(secInvalidada(it,s)){ cambios.push(s.label+": APROBACIÓN INVALIDADA (texto cambió tras aprobar) — re-confirmar"); }
      else cambios.push(s.label+": PENDIENTE de revisión");
    });
    return { campos:campos, cambios:cambios, sellos:sellos };
  }
  function flujo(it){
    var S=st(it); var p=payload(it); var v=it.verificacion; var L=[];
    L.push("// DRY-RUN — NO escribe nada. Rutas existentes, con autorización del usuario.");
    L.push("Revisor: "+(S.revisor||"(sin nombre)")+" · verificado: "+(S.verificado?"SÍ":"NO")+" · secciones por aprobar: "+pendientesN(it)+(invalidadasN(it)?" · INVALIDADAS: "+invalidadasN(it):""));
    L.push("Hashes: source_hash="+JSON.stringify(v.source_hash)+" · proposal_hash="+JSON.stringify(v.proposal_hash||null));
    L.push("Sellos por apartado (approved_hash): "+JSON.stringify(p.sellos));
    L.push("1) RE-LEER expediente y verificar: episodio activo=="+JSON.stringify(v.episodio_activo)+", fecha_corte=="+JSON.stringify(v.fecha_corte)+", source_hash=="+JSON.stringify(v.source_hash)+", sin notas SOAP posteriores. Si el source_hash ya no coincide, ABORTAR (el expediente cambió).");
    L.push("2) NO sobrescribir: solo se escriben las secciones ACEPTADAS/EDITADAS; conservar/rechazar NO tocan el expediente. Se conserva todo dato ajeno a los campos aprobados.");
    L.push("3) ACTIVO → saveDB('pts',[p],{camposHist:['dxFuncional','dx','historialCambios','fechaActualizacion','ultimoUsuario']}); MIGRADO → _persistirHistoricoFirestore. objetivosMP es NUEVO y aditivo (no borra CP/LP).");
    L.push("   campos a escribir = "+JSON.stringify(p.campos,null,1));
    L.push("4) historialCambios: "+JSON.stringify({quien:S.revisor||"<revisor>", cuando:"<ISO>", accion:"revisión IA aplicada", cambios:p.cambios}));
    L.push("5) Verificación de guardado: res.ok && res.guardados!==0 → ✅; res.pendiente → 📴 encolado; si no confirma → ⚠️ honesto. Mecanismo de recuperación: respaldo del antes para revertir.");
    L.push("ESTADO: "+(aprobado(it)? (Object.keys(p.campos).length? "listo para aplicar (pendiente de autorización)":"aprobado sin cambios") : "BLOQUEADO: "+(it.bloquea_plan?"seguridad sin resolver":(!S.verificado?"falta verificación":pendientesN(it)+" sección(es) pendientes"))));
    return L.join("\n");
  }

  window.RV={
    set:function(c,k,v){ var it=byc(c); var s=SEC.filter(function(x){return x.k===k;})[0]; var d=st(it).sec[k];
      d.modo=v; st(it).revisor=revisorActual()||st(it).revisor;
      // Modos de texto FIJO (conservar/aceptar/rechazar) se sellan al elegir, exigiendo revisor.
      if(v==="editar"){ d.approved_hash=null; d.ts=new Date().toISOString(); }
      else { if(!sellar(it,s)){ d.approved_hash=null; } }
      save(); },
    txt:function(c,k,t){ var it=byc(c); var d=st(it).sec[k]; d.texto=t; /* si ya estaba sellado, el mismatch de hash lo marca INVALIDADO al re-render */ try{localStorage.setItem(LS,JSON.stringify(ST));}catch(e){} },
    ins:function(c,k,w){ var it=byc(c); var d=st(it).sec[k]; var sec=it.secciones[k]; var add=w==="ant"?(sec.anterior||""):propTexto(sec,SEC.filter(function(s){return s.k===k;})[0]); d.texto=(d.texto!=null?d.texto:"")+(d.texto?"\n":"")+add; save(); },
    confirmar:function(c,k){ var it=byc(c); var s=SEC.filter(function(x){return x.k===k;})[0]; if(sellar(it,s)) save(); },
    verif:function(c,b){ var it=byc(c),S=st(it); S.verificado=b; S.revisor=revisorActual()||S.revisor; S.ts=new Date().toISOString(); save(); },
    dry:function(c){ var el=document.getElementById("dry_"+c); el.textContent=flujo(byc(c)); el.style.display=el.style.display==="block"?"none":"block"; }
  };

  function visibles(){
    var f=document.getElementById("filtro").value;
    return D.filter(function(it){
      if(f==="vacios") return it.nVacios>0;
      if(f==="bloq") return it.bloquea_plan;
      if(f==="pendientes") return !it.bloquea_plan && pendientesN(it)>0;
      if(f==="aprobados") return aprobado(it);
      return true;
    });
  }
  function render(){
    var vis=visibles();
    document.getElementById("lista").innerHTML=vis.map(card).join("")||'<div class="mut">Sin pacientes en este filtro.</div>';
    var nAp=D.filter(aprobado).length;
    document.getElementById("count").textContent=D.length+" pacientes · "+D.filter(function(i){return i.nVacios>0;}).length+" con vacíos · "+nAp+" aprobados · mostrando "+vis.length;
  }
  document.getElementById("banner").innerHTML='<b>Cómo usar.</b> Escribe tu nombre en <b>Revisor</b> (obligatorio: sin nombre no se aprueba nada). Revisa CADA apartado (dx médico, dx funcional, objetivos CP/MP/LP) por separado: <b>Conservar</b>, <b>Aceptar</b>, <b>Editar/combinar</b> o <b>Rechazar</b>. Todo inicia en <b>PENDIENTE</b>. Al editar, pulsa <b>✓ Confirmar apartado</b> para sellarlo. Si cambias el texto después de aprobar, la aprobación se <b>invalida</b> y hay que re-confirmar. Cada aprobación guarda <b>revisor + fecha + approved_hash</b>; se verifican además <b>source_hash</b> (expediente) y <b>proposal_hash</b> (propuesta). Un paciente queda <b>APROBADO</b> solo si verificaste y TODOS los apartados están sellados y sin cambios. "Preparar aplicación (en seco)" <b>no escribe nada</b>. Datos de prueba ('+esc(META.version||"")+', '+D.length+' pacientes). <b>No se aplica a expedientes reales sin autorización.</b>';
  document.getElementById("filtro").onchange=render;
  var rev=document.getElementById("revisor"); try{rev.value=localStorage.getItem("sinergia_revisor")||"";}catch(e){}
  rev.oninput=function(){ try{localStorage.setItem("sinergia_revisor",rev.value);}catch(e){} };
  document.getElementById("btnReset").onclick=function(){ if(confirm("¿Reiniciar todas las decisiones de este dispositivo?")){ ST={}; save(); } };
  document.getElementById("btnFlujo").onclick=function(){
    document.getElementById("modalTitle").textContent="Flujo de aplicación selectiva (rutas existentes, revisión profesional)";
    document.getElementById("modalBody").innerHTML='<ol style="font-size:13px;line-height:1.6">'+
      '<li>Revisión por SECCIÓN y por paciente: dx médico / dx funcional / objetivos CP / MP / LP. Nada se acepta automáticamente (todo inicia pendiente).</li>'+
      '<li>Si ya hay texto del fisio, por defecto se conserva; la propuesta es alternativa. Se puede combinar anterior + propuesta en "Editar".</li>'+
      '<li>Prioridad a expedientes con campos vacíos/pendientes/insuficientes.</li>'+
      '<li>Verificación previa: paciente, <b>episodio activo</b>, <b>fecha de corte</b>, sin notas SOAP posteriores, <b>source_hash</b>.</li>'+
      '<li>Escritura (misma maquinaria que "Editar datos"): ACTIVO → saveDB camposHist; MIGRADO → Firestore. Solo secciones aceptadas/editadas. <b>objetivosMP</b> es campo NUEVO aditivo; <b>no borra</b> objetivosCP/LP ni ningún dato ajeno.</li>'+
      '<li>Registro: quién revisó, cuándo, y el texto final aprobado (historialCambios con antes/después). Verificación de guardado y respaldo para revertir.</li>'+
      '<li>Un paciente con secciones sin revisar NO cuenta como aprobado. Todo es EN SECO; la aplicación real requiere tu autorización explícita.</li></ol>';
    document.getElementById("modal").showModal();
  };
  document.getElementById("btnExport").onclick=function(){
    var out={_meta:{generado:new Date().toISOString(),version:META.version||null,nota:"Decisiones de revisión (dry-run). No se aplicó a expedientes reales."},decisiones:[]};
    D.forEach(function(it){ var S=st(it); var p=payload(it); out.decisiones.push({codigo:it.codigo, revisor:S.revisor, aprobado:aprobado(it), verificado:S.verificado, source_hash:it.verificacion.source_hash, proposal_hash:it.verificacion.proposal_hash||null, secciones:Object.keys(S.sec).reduce(function(a,k){var d=S.sec[k];a[k]={modo:d.modo, revisor:d.revisor, ts:d.ts, approved_hash:d.approved_hash, aprobada:secAprobada(it,SEC.filter(function(x){return x.k===k;})[0]), invalidada:secInvalidada(it,SEC.filter(function(x){return x.k===k;})[0])};return a;},{}), campos:p.campos, cambios:p.cambios}); });
    var txt=JSON.stringify(out,null,1); try{var b=new Blob([txt],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="decisiones_revision.json";a.click();}catch(e){alert(txt.slice(0,400));}
  };
  document.getElementById("btnDryAll").onclick=function(){
    var ap=D.filter(function(it){return aprobado(it) && Object.keys(payload(it).campos).length;});
    var L=["// SIMULACIÓN EN SECO — "+ap.length+" paciente(s) aprobado(s) con cambios. NO se escribió nada.",""];
    ap.forEach(function(it){ L.push("### "+it.codigo); L.push(flujo(it)); L.push(""); });
    if(!ap.length) L.push("No hay pacientes aprobados con cambios. Revisa todas las secciones, marca verificación y acepta/edita al menos una.");
    document.getElementById("modalTitle").textContent="Simulación de guardado (en seco)";
    document.getElementById("modalBody").innerHTML='<pre style="white-space:pre-wrap;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace">'+esc(L.join("\n"))+'</pre>';
    document.getElementById("modal").showModal();
  };
  if(!D.length) document.getElementById("lista").innerHTML='<div class="banner">No hay datos. Genera datos_revision.js con tools/build_revision_data.js.</div>';
  else render();
})();
</script>
</body>
</html>
