# Auto-deploy a Firebase Hosting en cada push a main.
# Requiere el secreto de repositorio FIREBASE_SERVICE_ACCOUNT (JSON de una cuenta de
# servicio con rol "Firebase Hosting Admin" del proyecto clinicasinergia-ec2cf).
# Mientras ese secreto no exista, este workflow fallará (rojo) sin afectar nada más.
name: Deploy a Firebase Hosting

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Aviso si falta el secreto
        if: env.HAS_SA != 'true'
        run: echo "Falta el secreto FIREBASE_SERVICE_ACCOUNT — se omite el deploy (esto NO es un error)."

      - name: Checkout
        if: env.HAS_SA == 'true'
        uses: actions/checkout@v4

      - name: Deploy a Firebase Hosting (canal live)
        if: env.HAS_SA == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: clinicasinergia-ec2cf
          channelId: live
